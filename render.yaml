# Render deployment config (a "Blueprint").
#
# Render reads this when you create a service with "Apply" from the dashboard,
# or when you point Render at the repo and it detects the file.
#
# NO TORCH, AND THAT IS THE POINT
#   An earlier version installed CPU-only torch in the build command, because
#   the app used sentence-transformers. It no longer does - it uses ONNX
#   Runtime, which was the swap that made the free tier viable (measured: 555MB
#   with torch vs 226MB with ONNX, against a 512MB limit). Nothing imports torch
#   or sentence-transformers any more, so installing torch would add ~2.5GB of
#   download and several minutes to every build for a package that is never
#   loaded. The build command below is the plain default, and that is the whole
#   of it.
#
# SERVICE TIER AND ITS ACTUAL LIMITS
#   Free instance: 512MB RAM, sleeps after 15 min idle, and the first request
#   after a sleep takes 30-60s to boot the ~130MB embedding model. That is fine
#   for a visitor who waits, but it means you should test it COLD before
#   sending the link to anyone.
#
#   Measured peak RSS on this code is ~226MB (scripts/check_memory.py), which
#   leaves ~286MB of headroom. If a deploy ever starts dying mid-request, that
#   headroom is the first thing to re-check.

services:
  - type: web
    name: stock-footage-matcher
    runtime: python
    plan: free
    region: oregon
    # Python version is pinned below via the PYTHON_VERSION env var, NOT via a
    # `pythonVersion:` key. That key does not exist in Render's blueprint spec —
    # adding it made Render reject the whole file with "A Blueprint file was
    # found, but there was an issue" and no useful detail. Worth knowing because
    # the failure is silent-ish: the YAML looks fine and the dashboard gives no
    # line number.
    # The build command is spelled out rather than left to Render's default, and
    # that is not tidiness — it is the fix for a deploy that failed with
    # "streamlit: command not found". An earlier version of this file installed
    # CPU-only torch here; removing that key left Render's Build Command field
    # EMPTY rather than unset, and an empty field is not "use the default", it is
    # "run nothing". The build succeeded in 17s without ever pip-installing
    # anything, so the start command had no streamlit binary to run.
    #
    # The default, if it applied, is `pip install -r requirements.txt` — which is
    # exactly what is written here.
    buildCommand: pip install -r requirements.txt
    # Default start command is `python app.py`, which would start nothing —
    # this is a Streamlit app, so the command must say so.
    #
    # --server.headless is also in .streamlit/config.toml, but repeating it here
    # means the container still starts correctly if that file is ever lost.
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # Render's default Python moves over time, and the pinned wheels
      # (numpy 2.2.6, fastembed 0.7.3) are resolved against a specific ABI.
      # Naming it means a deploy in six months builds what was tested here.
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Sentence tokenisers fork on every encode otherwise; harmless, but it
      # wastes memory we are measurably short of.
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      # Where the ONNX weights are cached. Set explicitly because the free tier
      # has no persistent disk: the model is re-downloaded (~65MB, measured 8.6s
      # on this connection) every time the container wakes from a 15-minute
      # sleep. That download is the entire cold-start cost, so it is worth
      # knowing about rather than discovering as a "site is down" report.
      - key: FASTEMBED_CACHE_DIR
        value: "/tmp/fastembed_cache"